<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Gulung double tape">
  <rect width="200" height="200" rx="16" fill="#fdf3e8"/>
  <ellipse cx="100" cy="168" rx="62" ry="10" fill="#e8d9c4" opacity="0.6"/>
  <!-- Gulung tape condong -->
  <g transform="rotate(-18 100 105)">
    <circle cx="100" cy="105" r="62" fill="#f5f0e6" stroke="#d9cdb6" stroke-width="2"/>
    <circle cx="100" cy="105" r="62" fill="none" stroke="#efe6d5" stroke-width="10"/>
    <circle cx="100" cy="105" r="34" fill="#ffffff" stroke="#d9cdb6" stroke-width="2"/>
    <circle cx="100" cy="105" r="26" fill="#fdf3e8"/>
    <!-- Hujung tape terjuntai -->
    <path d="M158 82 q28 10 30 44 l-14 2 q-4 -28 -22 -36 z" fill="#f5f0e6" stroke="#d9cdb6" stroke-width="2"/>
  </g>
  <text x="100" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#e07514">DOUBLE TAPE</text>
</svg>
