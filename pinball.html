(function () {
'use strict';

// ==========================================================================
// 1. ASAS: KANVAS, SKALA
// ==========================================================================
const LW = 400, LH = 800;
const PF_ATAS = 176, PF_BAWAH = 800, GARIS_LONGKANG = 790;
const BOLA_R = 9;

const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const zonesEl  = document.getElementById('zones');
const zoneL    = zonesEl.children[0];
const zoneR    = zonesEl.children[1];
const btnLancar  = document.getElementById('btnLancar');
const btnGoncang = document.getElementById('btnGoncang');

let skalaLuar = 1;

function saiz() {
  const vw = window.innerWidth;
  const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
  const s  = Math.min(vw / LW, vh / LH);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  skalaLuar = s;
  cv.width  = Math.round(LW * s * dpr);
  cv.height = Math.round(LH * s * dpr);
  cv.style.width  = (LW * s) + 'px';
  cv.style.height = (LH * s) + 'px';
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
window.addEventListener('resize', saiz);
window.addEventListener('orientationchange', saiz);
if (window.visualViewport) window.visualViewport.addEventListener('resize', saiz);
saiz();

// helper roundRect (fallback sendiri, tak bergantung pada ctx.roundRect)
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}
function fon(px, tebal) { ctx.font = (tebal ? 'bold ' : '') + px + 'px "Courier New", monospace'; }
function teksMuat(t, maxW, px0, pxMin, tebal) {
  let px = px0;
  fon(px, tebal);
  while (ctx.measureText(t).width > maxW && px > pxMin) { px--; fon(px, tebal); }
  return px;
}
const klip = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd  = (a, b) => a + Math.random() * (b - a);

// ==========================================================================
// 2. AUDIO
// ==========================================================================
let actx = null;
let senyap = false;
try { senyap = localStorage.getItem('pinballAngkasa.senyap') === '1'; } catch (e) {}

function ensureAudio() {
  if (actx) { if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} } return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, freqEnd) {
  if (!actx || senyap) return;
  type = type || 'square'; vol = (vol === undefined ? 0.08 : vol);
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const g = actx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freqEnd !== undefined && freqEnd !== null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t0 + dur);
  }
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur);
}
function noiseBurst(dur, vol) {
  if (!actx || senyap) return;
  vol = (vol === undefined ? 0.12 : vol);
  const t0 = actx.currentTime;
  const buf = actx.createBuffer(1, Math.max(1, Math.floor(actx.sampleRate * dur)), actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource();
  const g = actx.createGain();
  src.buffer = buf;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(g).connect(actx.destination);
  src.start(t0);
}
function urutan(nada, jarak, dur, type, vol) {
  if (!actx || senyap) return;
  for (let i = 0; i < nada.length; i++) {
    (function (n, i) { setTimeout(function () { tone(n, dur, type, vol); }, i * jarak); })(nada[i], i);
  }
}
const SFX = {
  flipper()   { tone(200, 0.04, 'square', 0.06); },

  bulan()     { tone(300, 0.3, 'sine', 0.08, 520); },
  perisai()   { tone(1200, 0.12, 'sine', 0.09, 1600); },

  bos()       { tone(120, 0.15, 'sawtooth', 0.10, 60); },

}
function tulisRekod(p, o) { try { localStorage.setItem(KUNCI[p], JSON.stringify(o)); } catch (e) {} }

  { nama: 'MISI 2: KUTIP BINTANG',  pilih: 'PILIH: KUTIP BINTANG ⭐',  warna: '#ffd24d', perlu: 3, bonus: 3000,  sasaran: 'lorong' },

function seg(x1, y1, x2, y2, o) {

}

}

// --- busur gerbang atas A1 ----------------------------------------------
const ARC_CX = 200, ARC_CY = 370, ARC_R = 194;
// ketinggian siling busur pada sesuatu x (bahagian atas bulatan)
function busurY(x) {
  const dx = x - ARC_CX;
  const d2 = ARC_R * ARC_R - dx * dx;
  return d2 <= 0 ? ARC_CY : ARC_CY - Math.sqrt(d2);
}
(function buatBusur() {
  const a1 = Math.atan2(322 - ARC_CY, 12 - ARC_CX);   // ~ -2.891 rad
  const a2 = 0;                                        // (394,370)
  const N = 24;
  for (let i = 0; i < N; i++) {
    const t1 = a1 + (a2 - a1) * (i / N);
    const t2 = a1 + (a2 - a1) * ((i + 1) / N);
    seg(ARC_CX + ARC_R * Math.cos(t1), ARC_CY + ARC_R * Math.sin(t1),
        ARC_CX + ARC_R * Math.cos(t2), ARC_CY + ARC_R * Math.sin(t2),
        { r: 4, e: 0.45, jenis: 'busur', id: 'A1' });
  }
})();

const SOS = [];
(function buatSOS() {
  const pusat = [[54, 500], [80, 490], [106, 480]];
  const huruf = ['S', 'O', 'S'];
  const a = -21 * Math.PI / 180, hl = 14;
  for (let i = 0; i < 3; i++) {
    const cx = pusat[i][0], cy = pusat[i][1];
    const dx = Math.cos(a) * hl, dy = Math.sin(a) * hl;
    const s = seg(cx - dx, cy - dy, cx + dx, cy + dy, {
      jenis: 'sasaran', id: 'sos' + i, r: 5, e: 0.5,
      tumbang: false, anim: 0, huruf: huruf[i], cx: cx, cy: cy, sudut: a, idx: i
    });
    SOS.push(s);
  }
})();
let sosBangkitT = 0;

  for (let L = 0; L < 3; L++) {

const ditekan = new Map();

function kiraSemula() {
  const v = [];
  ditekan.forEach(function (val) { v.push(val); });
  FLIP.L.tekan = v.indexOf('L') >= 0;
  FLIP.R.tekan = v.indexOf('R') >= 0;
  zoneL.classList.toggle('on', FLIP.L.tekan);
  zoneR.classList.toggle('on', FLIP.R.tekan);
}
function sisiDari(x) { return x < window.innerWidth / 2 ? 'L' : 'R'; }

function kanvasKoord(e) {
  const r = cv.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (LW / r.width),
    y: (e.clientY - r.top) * (LH / r.height)
  };
}

// butang HUD dalam kanvas (senyap & jeda) — dalam jalur bezel
const HUD_SENYAP = { x: 30, y: 28 }, HUD_JEDA = { x: 78, y: 28 };
function kenaHud(k, b) { return Math.abs(k.x - b.x) <= 22 && Math.abs(k.y - b.y) <= 22; }

function tapKanvas(e) {
  const k = kanvasKoord(e);
  // butang HUD sentiasa aktif
  if (kenaHud(k, HUD_SENYAP)) {
    senyap = !senyap; simpanSenyap();
    if (!senyap) SFX.rollover();
    return true;
  }
  if (kenaHud(k, HUD_JEDA) && (keadaan === 'main' || keadaan === 'jeda')) {
    keadaan = (keadaan === 'main') ? 'jeda' : 'main';
    kemasButang();
    return true;
  }
  if (keadaan === 'mula') {
    if (k.x >= 50 && k.x <= 350 && k.y >= 340 && k.y <= 412) { mulaMain('edris'); return true; }
    if (k.x >= 50 && k.x <= 350 && k.y >= 430 && k.y <= 502) { mulaMain('enisa'); return true; }
    return true;
  }
  if (keadaan === 'jeda') { keadaan = 'main'; kemasButang(); return true; }
  if (keadaan === 'tamat') {
    if (tamatT < 0.7) return true;
    if (k.x >= 60 && k.x <= 340 && k.y >= 600 && k.y <= 672) { keadaan = 'mula'; kemasButang(); return true; }
    return true;
  }
  return false;
}

zonesEl.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  ensureAudio();
  if (upacara.aktif) { langkauUpacara(); return; }
  if (keadaan !== 'main') { tapKanvas(e); return; }
  if (tapKanvas(e)) return;
  if (bola.mode === 'sedia') { lancarTekan = true; }
  ditekan.set(e.pointerId, sisiDari(e.clientX));
  kiraSemula();
}, { passive: false });

zonesEl.addEventListener('pointermove', function (e) {
  if (!ditekan.has(e.pointerId)) return;
  const s = sisiDari(e.clientX);
  if (ditekan.get(e.pointerId) !== s) { ditekan.set(e.pointerId, s); kiraSemula(); }
}, { passive: false });

['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(function (ev) {
  zonesEl.addEventListener(ev, function (e) {
    if (ditekan.has(e.pointerId)) { ditekan.delete(e.pointerId); kiraSemula(); }
    if (lancarTekan && keadaan === 'main' && bola.mode === 'sedia') lancarBola();
  });
});
window.addEventListener('blur', function () { ditekan.clear(); kiraSemula(); lancarTekan = false; });

const KIRI_KEY  = ['KeyZ', 'KeyA', 'ArrowLeft'];
const KANAN_KEY = ['Slash', 'KeyM', 'KeyL', 'ArrowRight'];
window.addEventListener('keydown', function (e) {
  ensureAudio();
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.code) >= 0) e.preventDefault();
  if (e.repeat) return;
  if (upacara.aktif) { langkauUpacara(); return; }
  if (keadaan === 'mula') {
    if (e.code === 'Enter' || e.code === 'KeyR' || e.code === 'Space') mulaMain(profil);
    if (e.code === 'Digit1') mulaMain('edris');
    if (e.code === 'Digit2') mulaMain('enisa');
    return;
  }
  if (keadaan === 'tamat') {
    if ((e.code === 'Enter' || e.code === 'KeyR' || e.code === 'Space') && tamatT > 0.7) { keadaan = 'mula'; kemasButang(); }
    return;
  }
  if (e.code === 'KeyP') { keadaan = (keadaan === 'jeda') ? 'main' : 'jeda'; kemasButang(); return; }
  if (keadaan !== 'main') return;
  if (e.code === 'KeyN') { goncang(); return; }
  if (KIRI_KEY.indexOf(e.code) >= 0)  { ditekan.set('k-L', 'L'); kiraSemula(); }
  if (KANAN_KEY.indexOf(e.code) >= 0) { ditekan.set('k-R', 'R'); kiraSemula(); }
  if (e.code === 'Space' && bola.mode === 'sedia') lancarTekan = true;
});
window.addEventListener('keyup', function (e) {
  if (KIRI_KEY.indexOf(e.code) >= 0)  { ditekan.delete('k-L'); kiraSemula(); }
  if (KANAN_KEY.indexOf(e.code) >= 0) { ditekan.delete('k-R'); kiraSemula(); }
  if (e.code === 'Space' && keadaan === 'main' && bola.mode === 'sedia') lancarBola();
});

function isiPerisai() {
  perisaiGuna = T.perisaiKekal ? 99 : (misiSiapJumlah >= 2 ? 2 : 1);

}
function isiJaring() { JARING.caj = T.cajJaring; }

function lancarBola() {
  if (bola.mode !== 'sedia') { lancarTekan = false; return; }
  lancarTekan = false;
  bola.mode = 'lorong';
  bola.kuasa = lancarKuasa;

  SFX.lancar();

    sudahMain = true;
    if (misiAktif < 0) mulaMisi(0, true);

function goncang() {
  if (keadaan !== 'main' || goncangCd > 0) return;
  if (bola.mode !== 'bebas') return;
  goncangCd = 1.5;
  const a = rnd(-Math.PI * 0.85, -Math.PI * 0.15);
  bola.vx += Math.cos(a) * 130;
  bola.vy += Math.sin(a) * 130;
  SFX.goncang(); mesej('GONCANG!');
  gegar = Math.max(gegar, 3);
}

function tambahSkor(n) {
  let m = 1;
  if (pendarabT > 0) m *= 2;
  if (misiSiapJumlah >= 4) m *= 1.5;
  skor += Math.round(n * m);
}
function poin(n, x, y, warna) {
  tambahSkor(n);
  teksApung.push({ x: x, y: y, t: 0, teks: '+' + n, warna: warna || '#ffd24d' });
}

function letupan(x, y, n, warna, laju) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = rnd(laju * 0.3, laju);
    zarah.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, hidup: rnd(0.4, 1.1), warna: warna, r: rnd(1.2, 3) });
  }
}

// ---- misi ---------------------------------------------------------------
function senaraiBelumSiap() {
  const a = [];
  for (let i = 0; i < 6; i++) if (!misiSiapRound[i]) a.push(i);
  return a;
}
function sorotSeterusnya() {
  const a = senaraiBelumSiap();
  if (!a.length) return;
  let idx = a.indexOf(misiSorot);
  misiSorot = a[(idx + 1) % a.length];
  sorotT = 4;
}
function mulaMisi(i, senyapMula) {
  if (i < 0 || i > 5 || misiSiapRound[i]) {
    const a = senaraiBelumSiap();
    if (!a.length) return;
    i = a[0];
  }
  misiAktif = i; misiP = 0; autoMulaT = 0;
  if (MISI[i].sasaran === 'bos') { bos.hp = 8; bos.retak = 0; ZUHAL.r = 34; }
  if (MISI[i].sasaran === 'sos') { SOS.forEach(function (s) { s.tumbang = false; s.anim = 0; }); misiP = 0; }
  if (MISI[i].sasaran === 'lorong') { LORONG.forEach(function (l) { l.nyala = false; }); misiP = 0; }
  mesej(senyapMula ? 'MISI BERMULA!' : 'MISI BERMULA!');
  SFX.bintang();
}
function majuMisi(jenis, n) {
  if (misiAktif < 0) return;
  const m = MISI[misiAktif];
  if (m.sasaran !== jenis) return;
  misiP = Math.min(m.perlu, misiP + (n || 1));
  const baki = m.perlu - misiP;
  if (baki === 2) mesej('BAGUS! 2 LAGI!');
  else if (baki === 1) mesej('HEBAT! 1 LAGI!');
  if (misiP >= m.perlu) siapkanMisi();
}
function siapkanMisi() {
  const m = MISI[misiAktif];
  const bonus = m.bonus * pusingan;
  upacara.aktif = true; upacara.jenis = 'misi'; upacara.t = 0; upacara.jum = 2.6;
  upacara.teks = 'MISI SELESAI! 🎉'; upacara.warna = m.warna; upacara.bonus = bonus;
  upacara.skorMula = skor; upacara.skorAkhir = skor + bonus; upacara.tikT = 0;
  simpanV.x = bola.vx; simpanV.y = bola.vy;
  if (bola.mode === 'bebas') { bola.vx = 0; bola.vy = 0; bola.mode = 'beku'; }
  kilatSkrin = 0.15; kilatWarna = '#ffffff';
  SFX.misiSiap(); getar(40);
  kemasButang();
}
function selesaikanMisiSiap() {
  const idx = misiAktif;
  const m = MISI[idx];
  skor = upacara.skorAkhir;
  misiSiapRound[idx] = true;
  misiSiapJumlah++;
  const pangkatLama = Math.min(6, misiSiapJumlah - 1);
  const pangkatBaru = Math.min(6, misiSiapJumlah);

  // ganjaran tambahan
  if (m.sasaran === 'lorong') { isiPerisai(); isiJaring(); }
  if (m.sasaran === 'sos')    { simpanT = T.bolaSelamat; }
  if (m.sasaran === 'ramp')   { pendarabT = 20; mesej('SKOR DUA KALI GANDA!'); }
  if (m.sasaran === 'bulan')  { bolaTinggal++; bolaMaks++; mesej('DAPAT BOLA TAMBAHAN! 🎁'); }
  if (m.sasaran === 'bos')    { ZUHAL.r = 25; bos.hp = 0; mesej('RAJA METEOR KALAH! 👾'); letupan(ZUHAL.x, ZUHAL.y, 60, '#ff4d4d', 300); kilatSkrin = 0.2; }

  // isi semula caj jaring ikut kadar
  if (misiSiapJumlah % T.cajIsiSetiap === 0) isiJaring();
  isiPerisai();

  // pangkat naik?
  if (pangkatBaru > pangkatLama || misiSiapJumlah <= 6) {
    tambahSkor(2000);
    if (misiSiapJumlah === 3 && !bonusBolaDiberi) { bonusBolaDiberi = true; bolaTinggal++; bolaMaks++; }
    upacara.aktif = true; upacara.jenis = 'pangkat'; upacara.t = 0; upacara.jum = 1.5;
    upacara.pangkatBaru = pangkatBaru;
    SFX.pangkat(); getar([30, 60, 30]);
  } else {
    tamatkanUpacara();
  }
  misiAktif = -1; misiP = 0;

  // pusingan baharu?
  let semuaSiap = true;
  for (let i = 0; i < 6; i++) if (!misiSiapRound[i]) semuaSiap = false;
  if (semuaSiap) {
    pusingan++;
    misiSiapRound = [false, false, false, false, false, false];
    mesej('PUSINGAN ' + pusingan + ' BERMULA!');
    if (pusingan >= 2) mesej('KAMU WIRA ANGKASA! ✨');
  }
  misiSorot = senaraiBelumSiap()[0] || 0;
  sorotT = 0; autoMulaT = 0;
}
function tamatkanUpacara() {
  upacara.aktif = false; upacara.jenis = ''; upacara.t = 0;
  if (bola.mode === 'beku') { bola.mode = 'bebas'; bola.vx = simpanV.x; bola.vy = simpanV.y; }
  kemasButang();
}
function langkauUpacara() {
  if (!upacara.aktif) return;
  if (upacara.jenis === 'misi') { upacara.t = upacara.jum; kemasKiniUpacara(0); }
  else { upacara.t = upacara.jum; kemasKiniUpacara(0); }
}
function kemasKiniUpacara(dt) {
  upacara.t += dt;
  if (upacara.jenis === 'misi') {
    const p = klip((upacara.t - 0.6) / 1.0, 0, 1);
    skorPapar = upacara.skorMula + (upacara.skorAkhir - upacara.skorMula) * p;
    upacara.tikT -= dt;
    if (p > 0 && p < 1 && upacara.tikT <= 0) { upacara.tikT = 0.05; SFX.tik(); }
    if (upacara.t >= upacara.jum) selesaikanMisiSiap();
  } else if (upacara.jenis === 'pangkat') {
    if (upacara.t >= upacara.jum) tamatkanUpacara();
  }
}

function bolaHilang() {
  if (simpanT > 0) {
    mesej('BOLA SIMPANAN! CUBA LAGI');
    SFX.perisai();
    bola.x = 373; bola.y = 776; bola.vx = 0; bola.vy = 0; bola.mode = 'sedia';

function tamatPermainan() {
  keadaan = 'tamat';
  tamatT = 0; tamatSkorPapar = 0;
  const r = bacaRekod(profil);
  rekodLama = { pangkat: r.pangkatTertinggi, skor: r.skorTerbaik };
  rekodBaharu = (skor > r.skorTerbaik) || (Math.min(6, misiSiapJumlah) > r.pangkatTertinggi);
  r.skorTerbaik = Math.max(r.skorTerbaik, skor);
  r.pangkatTertinggi = Math.max(r.pangkatTertinggi, Math.min(6, misiSiapJumlah));
  r.pusinganTerbaik = Math.max(r.pusinganTerbaik || 1, pusingan);
  for (let i = 0; i < 6; i++) if (misiSiapRound[i]) r.misiSiap[i] = true;
  tulisRekod(profil, r);
  kemasButang();
}

// ==========================================================================
// 11. FIZIK
// ==========================================================================
function nearest(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
  let t = L2 > 0 ? ((px - x1) * dx + (py - y1) * dy) / L2 : 0;
  t = klip(t, 0, 1);
  return { x: x1 + t * dx, y: y1 + t * dy, t: t };
}

function pantulSegmen(s) {
  const n = nearest(bola.x, bola.y, s.x1, s.y1, s.x2, s.y2);
  let dx = bola.x - n.x, dy = bola.y - n.y;
  let d = Math.hypot(dx, dy);
  const R = BOLA_R + (s.r || 3);
  if (d >= R) return null;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  bola.x += nx * (R - d + 0.05); bola.y += ny * (R - d + 0.05);
  const vn = bola.vx * nx + bola.vy * ny;
  if (vn < 0) {
    const tx = -ny, ty = nx;
    let vt = bola.vx * tx + bola.vy * ty;
    const nvn = -vn * (s.e === undefined ? 0.55 : s.e);
    vt *= 0.98;
    bola.vx = nx * nvn + tx * vt;
    bola.vy = ny * nvn + ty * vt;
  }
  return { nx: nx, ny: ny };
}
function pantulBulatan(b) {
  let dx = bola.x - b.x, dy = bola.y - b.y;
  let d = Math.hypot(dx, dy);
  const R = BOLA_R + b.r;
  if (d >= R) return null;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  bola.x += nx * (R - d + 0.05); bola.y += ny * (R - d + 0.05);
  const vn = bola.vx * nx + bola.vy * ny;
  if (vn < 0) {
    const tx = -ny, ty = nx;
    let vt = bola.vx * tx + bola.vy * ty;
    const nvn = -vn * (b.e === undefined ? 0.6 : b.e);
    vt *= 0.98;
    bola.vx = nx * nvn + tx * vt;
    bola.vy = ny * nvn + ty * vt;
  }
  return { nx: nx, ny: ny };
}

function kemasFlipper(dt) {
  ['L', 'R'].forEach(function (k) {
    const f = FLIP[k];
    const sasar = f.tekan ? SUDUT_AKTIF : SUDUT_REHAT;
    const masa = f.tekan ? 0.055 : 0.095;
    const lama = f.sudut;
    const jarak = SUDUT_REHAT - SUDUT_AKTIF;
    const langkahMaks = (jarak / masa) * dt;
    if (Math.abs(sasar - f.sudut) <= langkahMaks) f.sudut = sasar;
    else f.sudut += Math.sign(sasar - f.sudut) * langkahMaks;
    f.w = (f.sudut - lama) / dt;
    if (f.sudut !== lama && Math.abs(f.w) > 5 && f.tekan && !f.bunyi) { f.bunyi = true; SFX.flipper(); getar(10); }
    if (!f.tekan) f.bunyi = false;
  });
}
function hujungFlipper(f) {
  const L = T.flipPanjang;
  return { x: f.px + f.dir * L * Math.cos(f.sudut), y: f.py + L * Math.sin(f.sudut) };
}
function kolisiFlipper(f) {
  const h = hujungFlipper(f);
  const n = nearest(bola.x, bola.y, f.px, f.py, h.x, h.y);
  let dx = bola.x - n.x, dy = bola.y - n.y;
  let d = Math.hypot(dx, dy);
  const R = BOLA_R + FLIP_R;
  if (d >= R) return;
  if (d < 0.0001) { dx = 0; dy = -1; d = 1; }
  let nx = dx / d, ny = dy / d;
  // a. tolak keluar DAHULU
  bola.x += nx * (R - d + 0.1); bola.y += ny * (R - d + 0.1);
  // b. halaju titik sentuh
  const rx = n.x - f.px, ry = n.y - f.py;
  const w = f.w * f.dir;
  const vfx = -w * ry, vfy = w * rx;
  const vn = bola.vx * nx + bola.vy * ny;
  const vfn = vfx * nx + vfy * ny;
  const tx = -ny, ty = nx;
  let vt = bola.vx * tx + bola.vy * ty;
  const nvn = -vn * 0.45 + vfn * 1.15;
  vt *= 0.95;
  bola.vx = nx * nvn + tx * vt;
  bola.vy = ny * nvn + ty * vt;
  // d. kepit
  const sp = Math.hypot(bola.vx, bola.vy);
  if (sp > 470) { bola.vx = bola.vx / sp * 470; bola.vy = bola.vy / sp * 470; }
  // 4. masih bertindih?
  const n2 = nearest(bola.x, bola.y, f.px, f.py, h.x, h.y);
  let dx2 = bola.x - n2.x, dy2 = bola.y - n2.y;
  let d2 = Math.hypot(dx2, dy2);
  if (d2 < R) {
    if (d2 < 0.0001) { dx2 = 0; dy2 = -1; d2 = 1; }
    const ux = dx2 / d2, uy = dy2 / d2;
    bola.x = n2.x + ux * (R + 0.5);
    bola.y = n2.y + uy * (R + 0.5);
    const vv = bola.vx * ux + bola.vy * uy;
    if (vv < 120) { bola.vx += ux * (120 - vv); bola.vy += uy * (120 - vv); }
  }
}

function kick(nx, ny, laju) {
  const L = Math.hypot(nx, ny) || 1;
  bola.vx = nx / L * laju;
  bola.vy = ny / L * laju;
}

// ---- pencetus zon -------------------------------------------------------
function semakLorongAtas() {
  const siling = busurY(bola.x);
  if (bola.y > siling + LORONG_TEBAL) return;
  for (let i = 0; i < 3; i++) {
    const l = LORONG[i];
    if (l.cd > 0) continue;
    if (bola.x >= l.x1 && bola.x <= l.x2) {
      l.cd = 0.6;
      poin(100, bola.x, bola.y, '#ffd24d');
      SFX.rollover();
      if (!l.nyala) {
        l.nyala = true;
        mesej('BINTANG MENYALA! ⭐');
        if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'lorong') {
          let n = 0; LORONG.forEach(function (q) { if (q.nyala) n++; });
          misiP = n;
        }
      }
      if (misiAktif < 0) { sorotSeterusnya(); }
      let semua = true;
      LORONG.forEach(function (q) { if (!q.nyala) semua = false; });
      if (semua) {
        poin(1000, 180, 210, '#ffd24d');
        mesej('TIGA BINTANG! +1000');
        SFX.bintang();
        if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'lorong') { misiP = 3; siapkanMisi(); }
        LORONG.forEach(function (q) { q.nyala = false; });
        letupan(180, 215, 20, '#ffd24d', 140);
      }
      break;
    }
  }
}

function masukRamp(s) {
  bola.mode = 'ramp';
  bola.rampSisi = s.sisi;
  bola.rampT = 0;
  s.kincir = 1.2;
  SFX.ramp(); SFX.kincir();
  poin(150, bola.x, bola.y, '#38ef7d');
  mesej('RAMP! WHOOSH! +800');
  getar(10);
}
function habisRamp() {
  poin(800, 180, 620, '#38ef7d');
  majuMisi('ramp', 1);
  if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'bos') kenaBos(2);
  isiPerisai();
}

function semakLubang() {
  if (bola.lubangCd > 0) return;
  const laju = Math.hypot(bola.vx, bola.vy);
  const dc = Math.hypot(bola.x - CACING.x, bola.y - CACING.y);
  if (dc < CACING.rc && laju < 430) {
    bola.mode = 'lubang';
    bola.lubang = 'cacing'; bola.lubangT = 0;
    bola.lx = bola.x; bola.ly = bola.y;
    SFX.cacing();
    poin(500, CACING.x, CACING.y, '#a44dff');
    mesej('LUBANG CACING! +500');
    if (misiAktif < 0) { mulaMisi(misiSorot); }
    return;
  }
  const db = Math.hypot(bola.x - BULAN.x, bola.y - BULAN.y);
  if (db < BULAN.rc && laju < 460) {
    bola.mode = 'lubang';
    bola.lubang = 'bulan'; bola.lubangT = 0;
    bola.lx = bola.x; bola.ly = bola.y;
    SFX.bulan();
    poin(750, BULAN.x, BULAN.y, '#c0d0e0');
    mesej('MENDARAT DI BULAN! +750');
    majuMisi('bulan', 1);
  }
}

function kenaBos(n) {
  if (bos.hp <= 0) return;
  bos.hp -= n;
  bos.retak = Math.min(5, bos.retak + 1);
  bos.goyang = 0.3;
  gegar = Math.max(gegar, 4);
  SFX.bos();
  poin(500 * n, ZUHAL.x, ZUHAL.y, '#ff4d4d');
  if (bos.hp > 0) mesej('KENA BOS! ♥ TINGGAL ' + bos.hp);
  misiP = Math.min(8, 8 - bos.hp);
  if (bos.hp <= 0) { misiP = 8; siapkanMisi(); }
}

// ---- langkah fizik ------------------------------------------------------
function skripLangkah(dt) {
  if (bola.mode === 'sedia') {
    if (lancarTekan) lancarKuasa = Math.min(1, lancarKuasa + dt / 1.1);
    lancarAutoT += dt;
    if (lancarAutoT > 6) { lancarKuasa = Math.max(lancarKuasa, 0.6); lancarBola(); }
    return;
  }
  if (bola.mode === 'lorong') {
    bola.y -= 520 * dt;
    if (bola.y < 300) {
      const p = klip((300 - bola.y) / 45, 0, 1);
      bola.x = 373 - 33 * p;
    }
    if (bola.y <= 255) {
      bola.x = 340; bola.y = 255;
      bola.mode = 'bebas';
      const laju = Math.min(480, 320 + 200 * (bola.kuasa || 0));
      kick(-0.55, -0.83, laju);
      lancarKuasa = 0;
      kemasButang();
    }
    return;
  }
  if (bola.mode === 'ramp') {
    bola.rampT += dt;
    if (bola.rampT >= 0.9) {
      const L = LALUAN_RAMP[bola.rampSisi];
      bola.x = L.keluar[0]; bola.y = L.keluar[1];
      bola.vx = 0; bola.vy = 130;
      bola.mode = 'bebas';
      habisRamp();
    }
    return;
  }
  if (bola.mode === 'lubang') {
    bola.lubangT += dt;
    const had = (bola.lubang === 'cacing') ? 1.0 : 1.0;
    if (bola.lubangT >= had || bola.lubangT >= 1.4) {
      if (bola.lubang === 'cacing') {
        const kiri = Math.random() < 0.5;
        const dx = kiri ? -0.55 : 0.55, dy = 0.84;
        const jarak = CACING.rc + BOLA_R + 3;
        bola.x = CACING.x + dx * jarak; bola.y = CACING.y + dy * jarak;
        kick(dx, dy, 205);
      } else {
        const dx = -0.55, dy = 0.84;
        const jarak = BULAN.rc + BOLA_R + 3;
        bola.x = BULAN.x + dx * jarak; bola.y = BULAN.y + dy * jarak;
        kick(dx, dy, 220);
      }
      bola.lubangCd = 0.8;
      bola.mode = 'bebas';
      letupan(bola.x, bola.y, 12, bola.lubang === 'cacing' ? '#a44dff' : '#c0d0e0', 120);
    }
    return;
  }
  // 'beku' — tiada apa-apa
}

function langkahFizik(dt) {
  kemasFlipper(dt);

  if (bola.mode !== 'bebas') { skripLangkah(dt); return; }

  bola.pv.x = bola.x; bola.pv.y = bola.y;

  if (bola.lubangCd > 0) bola.lubangCd = Math.max(0, bola.lubangCd - dt);

  bola.vy += T.grav * dt;
  bola.vx *= 0.999; bola.vy *= 0.999;

  let sp = Math.hypot(bola.vx, bola.vy);
  if (sp > T.hadLaju) { bola.vx = bola.vx / sp * T.hadLaju; bola.vy = bola.vy / sp * T.hadLaju; sp = T.hadLaju; }
  if (sp < 40 && sp > 0.001 && bola.y < 700 && bola.vy > 0) { bola.vx = bola.vx / sp * 40; bola.vy = bola.vy / sp * 40; }

  bola.x += bola.vx * dt;
  bola.y += bola.vy * dt;

  // --- segmen ---
  for (let i = 0; i < segmen.length; i++) {
    const s = segmen[i];
    if (s.jenis === 'sasaran' && s.tumbang) continue;
    if (s.jenis === 'perisai' && !s.hidup) continue;
    if (s.jenis === 'jaring' && (JARING.caj <= 0 || masaBolaIni > 240)) continue;

    if (s.jenis === 'ramp') {
      const n = nearest(bola.x, bola.y, s.x1, s.y1, s.x2, s.y2);
      const d = Math.hypot(bola.x - n.x, bola.y - n.y);
      if (d < BOLA_R + s.r) {
        if (bola.vy < -120 && sisiGaris(s, bola.pv.x, bola.pv.y) < 0) { masukRamp(s); return; }
        pantulSegmen(s);
      }
      continue;
    }

    const hit = pantulSegmen(s);
    if (!hit) continue;

    if (s.jenis === 'sling') {
      kick(s.nx, s.ny, 265);
      s.kilat = 0.15;
      poin(50, (s.x1 + s.x2) / 2, (s.y1 + s.y2) / 2, '#ff44cc');
      SFX.sling(); getar(10);
      mesej('SLINGSHOT! +50');
    } else if (s.jenis === 'perisai') {
      kick(s.nx, s.ny, 300);
      s.kilat = 0.4;
      // Injap anti-maraton: selepas 150s pada SATU bola, perisai terus padam
      // (budak 6 tahun jarang bertahan selama itu — ini cuma pastikan permainan
      // boleh tamat, bukan menghukum permainan biasa).
      if (masaBolaIni > 150) {
        perisaiGuna = 0;
        PERISAI_KIRI.hidup = false; PERISAI_KANAN.hidup = false;
      } else if (!T.perisaiKekal) {
        perisaiGuna--;
        if (perisaiGuna <= 0) { PERISAI_KIRI.hidup = false; PERISAI_KANAN.hidup = false; }
      }
      SFX.perisai(); getar(10);
      mesej('PERISAI SELAMATKAN KAMU!');
      letupan(bola.x, bola.y, 12, '#00e5ff', 130);
    } else if (s.jenis === 'jaring') {
      bola.vx = rnd(-60, 60);
      bola.vy = -320;
      JARING.caj--; JARING.kilat = 0.4;
      SFX.perisai(); getar(10);
      mesej('JARING TANGKAP BOLA! 💚');
      letupan(bola.x, bola.y, 14, '#38ef7d', 150);
    } else if (s.jenis === 'sasaran') {
      s.tumbang = true; s.anim = 0;
      poin(200, s.cx, s.cy, '#38ef7d');
      SFX.sasaran(); mesej('S-O-S JATUH! +200');
      let n = 0; SOS.forEach(function (q) { if (q.tumbang) n++; });
      if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'sos') misiP = n;
      if (n === 3) {
        poin(2000, 80, 490, '#38ef7d');
        mesej('SEMUA S-O-S! +2000');
        sosBangkitT = 6;
        letupan(80, 490, 24, '#38ef7d', 160);
        if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'sos') { misiP = 3; siapkanMisi(); return; }
        if (misiAktif >= 0 && MISI[misiAktif].sasaran === 'bos') kenaBos(2);
      }
    }
  }

  if (bola.mode !== 'bebas') return;

  // --- bulatan ---
  for (let i = 0; i < bulatan.length; i++) {
    const b = bulatan[i];
    if (b.jenis === 'bumper') {
      if (b.cd > 0) { pantulBulatan(b); continue; }
      const hit = pantulBulatan(b);
      if (hit) {
        b.cd = 0.09; b.kilat = 0.35;
        kick(hit.nx, hit.ny, 235);
        SFX.bumper(); getar(10);
        planetBolaIni++;
        poin(100, b.x, b.y, '#ff44cc');
        mesej('PLANET KENA! +100');
        if (b === ZUHAL && bos.hp > 0) kenaBos(1);
        else majuMisi('planet', 1);
      }
    } else {
      pantulBulatan(b);
    }
  }

  if (bola.mode !== 'bebas') return;

  // --- flipper ---
  kolisiFlipper(FLIP.L);
  kolisiFlipper(FLIP.R);

  // --- zon ---
  semakLorongAtas();
  semakLubang();

  if (bola.mode !== 'bebas') return;

  // --- anti sangkut ---
  const sp2 = Math.hypot(bola.vx, bola.vy);
  if (sp2 < 25) {
    bola.lambatT += dt;
    if (bola.lambatT > 2.0) {
      bola.lambatT = 0;
      const a = rnd(-Math.PI * 0.85, -Math.PI * 0.15);
      bola.vx += Math.cos(a) * 130; bola.vy += Math.sin(a) * 130;
      mesej('TOLAK SIKIT!'); SFX.goncang();
    }
  } else bola.lambatT = 0;

  // --- luar sempadan (senyap) ---
  if (bola.x < 8 || bola.x > 398 || bola.y < PF_ATAS - 30) {
    bola.x = 373; bola.y = 776; bola.vx = 0; bola.vy = 0;
    bola.mode = 'sedia'; lancarKuasa = 0; lancarAutoT = 0;
    kemasButang();
    return;
  }

  // --- longkang ---
  if (bola.y > GARIS_LONGKANG) {
    bolaHilang();
  }
}

// ==========================================================================
// 12. KEMAS KINI UMUM
// ==========================================================================
function kemasKini(dt) {
  nebulaT += dt; satelitA += dt * 0.35;
  CACING.putar += dt;
  for (let L = 0; L < 3; L++) {
    const lap = lapisanBintang[L];
    for (let i = 0; i < lap.arr.length; i++) {
      const b = lap.arr[i];
      b.y += lap.laju * dt;
      b.f += dt * 2;
      if (b.y > LH) { b.y = 0; b.x = Math.random() * LW; }
    }
  }
  if (gegar > 0) gegar = Math.max(0, gegar - dt * 20);
  if (kilatSkrin > 0) kilatSkrin = Math.max(0, kilatSkrin - dt);

  // zarah
  for (let i = zarah.length - 1; i >= 0; i--) {
    const p = zarah[i];
    p.t += dt; p.vy += 200 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t >= p.hidup) zarah.splice(i, 1);
  }
  for (let i = teksApung.length - 1; i >= 0; i--) {
    teksApung[i].t += dt;
    teksApung[i].y -= 24 * dt;
    if (teksApung[i].t > 0.9) teksApung.splice(i, 1);
  }

  // kilat objek
  [MARIKH, NEPTUN, ZUHAL].forEach(function (b) {
    if (b.cd > 0) b.cd = Math.max(0, b.cd - dt);
    if (b.kilat > 0) b.kilat = Math.max(0, b.kilat - dt);
  });
  [SL_KIRI, SL_KANAN, PERISAI_KIRI, PERISAI_KANAN, JARING].forEach(function (s) {
    if (s.kilat > 0) s.kilat = Math.max(0, s.kilat - dt);
  });
  [RAMP_KIRI, RAMP_KANAN].forEach(function (s) { if (s.kincir > 0) s.kincir = Math.max(0, s.kincir - dt); });
  LORONG.forEach(function (l) { if (l.cd > 0) l.cd = Math.max(0, l.cd - dt); });
  SOS.forEach(function (s) { if (s.tumbang && s.anim < 1) s.anim = Math.min(1, s.anim + dt * 5); if (!s.tumbang && s.anim > 0) s.anim = Math.max(0, s.anim - dt * 5); });
  if (bos.goyang > 0) bos.goyang = Math.max(0, bos.goyang - dt);

  if (keadaan !== 'main') return;

  masaMain += dt;
  if (masaMain > 12) pilMalapT = 1;
  if (pilTerangT > 0) pilTerangT -= dt;
  zonesEl.classList.toggle('malap', pilMalapT > 0 && pilTerangT <= 0);

  if (goncangCd > 0) goncangCd = Math.max(0, goncangCd - dt);
  if (pendarabT > 0) pendarabT = Math.max(0, pendarabT - dt);
  if (sorotT > 0) sorotT = Math.max(0, sorotT - dt);

  if (sosBangkitT > 0) {
    sosBangkitT -= dt;
    if (sosBangkitT <= 0) { SOS.forEach(function (s) { s.tumbang = false; }); }
  }

  if (upacara.aktif) { kemasKiniUpacara(dt); }
  else {
    if (bola.mode === 'bebas') masaBolaIni += dt;
    if (simpanT > 0 && bola.mode === 'bebas') simpanT = Math.max(0, simpanT - dt);

    // pemilih misi
    if (misiAktif < 0 && sudahMain) {
      autoMulaT += dt;
      if (sorotT <= 0) { sorotSeterusnya(); }
      if (autoMulaT > 20) { mesej('MISI AUTO BERMULA!'); mulaMisi(misiSorot); }
    }
    // graviti pandu turun kalau bola terlalu lama
    const gAsal = mudah ? 230 : 260;
    T.grav = (masaBolaIni > 240) ? gAsal * 1.4 : gAsal;
  }

  // mesej
  if (mesejSemasa) {
    mesejT -= dt;
    if (mesejT <= 0) mesejSemasa = null;
  }
  if (!mesejSemasa && giliran.length) { mesejSemasa = giliran.shift(); mesejT = 1.6; }

  // skor papar
  if (!upacara.aktif) {
    const bz = skor - skorPapar;
    if (Math.abs(bz) < 1) skorPapar = skor;
    else skorPapar += bz * Math.min(1, dt * 7);
  }
}

function lukisLatar() {
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#05030f'); g.addColorStop(1, '#180a33');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);

  // nebula
  const n1x = 110 + Math.sin(nebulaT * 0.09) * 30, n1y = 420 + Math.cos(nebulaT * 0.07) * 40;
  let ng = ctx.createRadialGradient(n1x, n1y, 5, n1x, n1y, 190);
  ng.addColorStop(0, 'rgba(164,77,255,0.10)'); ng.addColorStop(1, 'rgba(164,77,255,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, LW, LH);
  const n2x = 290 + Math.cos(nebulaT * 0.06) * 30, n2y = 250 + Math.sin(nebulaT * 0.08) * 35;
  ng = ctx.createRadialGradient(n2x, n2y, 5, n2x, n2y, 170);
  ng.addColorStop(0, 'rgba(255,68,204,0.08)'); ng.addColorStop(1, 'rgba(255,68,204,0)');
  ctx.fillStyle = ng; ctx.fillRect(0, 0, LW, LH);

  // bintang
  for (let L = 0; L < 3; L++) {
    const lap = lapisanBintang[L];
    for (let i = 0; i < lap.arr.length; i++) {
      const b = lap.arr[i];
      const a = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(b.f));
      ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      ctx.fillRect(b.x, b.y, b.s, b.s);
    }
  }
}

function lukisBezel() {
  const g = ctx.createLinearGradient(0, 0, 0, 56);
  g.addColorStop(0, '#1a1a26'); g.addColorStop(0.5, '#2a2a3c'); g.addColorStop(1, '#12121c');

function lukisHudButang(x, y, ikon) {

function lukisLencana(x, y, s, idx, alpha) {
  const P = PANGKAT[Math.min(6, Math.max(0, idx))];
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalAlpha = (alpha === undefined ? 1 : alpha);

  if (P.aura) {
    const ag = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
    ag.addColorStop(0, 'rgba(255,210,77,0.55)'); ag.addColorStop(1, 'rgba(255,210,77,0)');
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 6.283); ctx.fill();
  }
  if (P.adiwira) {
    ctx.save();
    ctx.rotate(satelitA * 2);
    ctx.strokeStyle = 'rgba(255,210,77,0.7)'; ctx.lineWidth = 1.4;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 11, Math.sin(a) * 11);
      ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
      ctx.stroke();
    }
    ctx.restore();
    const gg = ctx.createRadialGradient(0, -2, 1, 0, 0, 11);
    gg.addColorStop(0, '#fff3c4'); gg.addColorStop(1, '#c9971a');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, 11, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#5a3d00';
    lukisBintangKecil(0, 0, 6);
    ctx.restore();
    return;
  }

  // perisai
  ctx.beginPath();
  ctx.moveTo(0, -13);
  ctx.lineTo(11, -8);
  ctx.lineTo(11, 4);
  ctx.quadraticCurveTo(11, 11, 0, 14);
  ctx.quadraticCurveTo(-11, 11, -11, 4);
  ctx.lineTo(-11, -8);
  ctx.closePath();
  const sg = ctx.createLinearGradient(0, -13, 0, 14);
  sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.35, P.logam); sg.addColorStop(1, '#2b2b3a');
  ctx.fillStyle = sg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1; ctx.stroke();

  if (P.sayap) {
    ctx.fillStyle = P.logam;
    for (let d = -1; d <= 1; d += 2) {
      ctx.beginPath();
      ctx.moveTo(d * 10, -4);
      ctx.lineTo(d * 19, -7);
      ctx.lineTo(d * 19, -3);
      ctx.lineTo(d * 10, 0);
      ctx.closePath(); ctx.fill();
    }
  }
  // chevron
  ctx.strokeStyle = '#14141f'; ctx.lineWidth = 1.8;
  for (let i = 0; i < P.chev; i++) {
    const yy = 2 + i * 4;
    ctx.beginPath(); ctx.moveTo(-6, yy); ctx.lineTo(0, yy - 3.2); ctx.lineTo(6, yy); ctx.stroke();
  }
  // bintang
  ctx.fillStyle = '#14141f';
  if (P.bintang === 1) lukisBintangKecil(0, -5, 3.6);
  else if (P.bintang === 2) { lukisBintangKecil(-4, -5, 3.2); lukisBintangKecil(4, -5, 3.2); }
  else if (P.bintang >= 3) { lukisBintangKecil(-5, -5, 3); lukisBintangKecil(0, -7, 3); lukisBintangKecil(5, -5, 3); }
  ctx.restore();
}
function lukisBintangKecil(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr2 = (i % 2 === 0) ? r : r * 0.45;
    const px = cx + Math.cos(a) * rr2, py = cy + Math.sin(a) * rr2;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function lukisPapanSkor() {
  const emasPenuh = misiSiapJumlah >= 6;
  ctx.save();
  rr(10, 56, 380, 114, 10);
  ctx.fillStyle = emasPenuh ? '#1a1405' : '#0a0620'; ctx.fill();
  ctx.strokeStyle = emasPenuh ? '#ffd24d' : '#ff44cc'; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let y = 58; y < 170; y += 4) ctx.fillRect(10, y, 380, 1);
  ctx.restore();

  const pIdx = Math.min(6, misiSiapJumlah);
  // BARIS 1
  lukisLencana(31, 76, 0.78, pIdx);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#00e5ff'; fon(12, true);
  let nm = 'PANGKAT: ' + PANGKAT[pIdx].nama;
  if (pusingan >= 2) nm += ' ⭐×' + pusingan;
  teksMuat(nm, 210, 12, 9, true);
  ctx.fillText(nm, 50, 76);
  // bintang jasa
  const jasa = Math.min(5, Math.floor(skor / 20000));
  ctx.fillStyle = '#ffd24d';
  for (let i = 0; i < jasa; i++) lukisBintangKecil(52 + i * 9, 90, 3.4);
  // bola tinggal
  const nMax = Math.min(5, bolaMaks);
  for (let i = 0; i < nMax; i++) {
    const bx = 382 - 5 - i * 16;
    ctx.beginPath(); ctx.arc(bx, 76, 5, 0, 6.283);
    ctx.fillStyle = (i < bolaTinggal) ? '#ff44cc' : '#3a3a55'; ctx.fill();
    if (i < bolaTinggal) { ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1; ctx.stroke(); }
  }

  // BARIS 2 — skor
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffd24d'; fon(30, true);
  ctx.fillText(String(Math.round(skorPapar)).padStart(6, '0'), 382, 110);
  // kiri
  ctx.textAlign = 'left';
  if (pendarabT > 0) {
    ctx.fillStyle = '#ff4d4d'; fon(15, true);
    rr(18, 98, 36, 20, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText('×2', 24, 108);
    ctx.fillStyle = '#3a3a55'; ctx.fillRect(18, 121, 36, 3);
    ctx.fillStyle = '#ff4d4d'; ctx.fillRect(18, 121, 36 * (pendarabT / 20), 3);
  } else {
    ctx.fillStyle = '#00e5ff'; fon(11, true);
    ctx.fillText('PERISAI', 18, 104);
    const aktifP = (PERISAI_KIRI.hidup ? 1 : 0) + (PERISAI_KANAN.hidup ? 1 : 0);
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(22 + i * 11, 118, 4, 0, 6.283);
      let on = (i < 2) ? (i < aktifP) : (JARING.caj > 0);
      ctx.fillStyle = on ? '#00e5ff' : '#2a2a40'; ctx.fill();
    }
  }

  // BARIS 3 — panel mesej
  rr(16, 130, 368, 32, 6);
  ctx.fillStyle = '#05030f'; ctx.fill();
  ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 1; ctx.stroke();
  const t = mesejSemasa || barisMisi();
  const warnaT = mesejSemasa ? '#ffffff' : (misiAktif >= 0 ? MISI[misiAktif].warna : '#00e5ff');
  ctx.fillStyle = warnaT;
  teksMuat(t, 352, 17, 11, true);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(t, 200, 147);
  // bar kemajuan
  if (misiAktif >= 0) {
    const pr = klip(misiP / MISI[misiAktif].perlu, 0, 1);
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fillRect(18, 165, 364, 3);
    ctx.fillStyle = MISI[misiAktif].warna; ctx.fillRect(18, 165, 364 * pr, 3);
  }
  ctx.restore();
}

function lukisDinding() {

function lukisPlanet(b, warnaA, warnaB) {
  const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
  g.addColorStop(0, warnaA); g.addColorStop(1, warnaB);
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function lukisBumper() {
  // MARIKH
  lukisPlanet(MARIKH, '#ff6b4d', '#a02010');
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  [[-8, -6, 5], [6, 3, 6], [-3, 10, 4]].forEach(function (k) {

  });

    const g = ctx.createRadialGradient(ZUHAL.x - 10, ZUHAL.y - 10, 3, ZUHAL.x, ZUHAL.y, ZUHAL.r);
    g.addColorStop(0, '#8a5a4a'); g.addColorStop(1, '#33161a');
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {

      const rr2 = ZUHAL.r * ((i % 2 === 0) ? 1 : 0.82);
      const px = ZUHAL.x + Math.cos(a) * rr2, py = ZUHAL.y + Math.sin(a) * rr2;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2; ctx.stroke();
    // retak
    ctx.strokeStyle = 'rgba(255,120,60,0.8)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < bos.retak; i++) {
      const a = i * 1.3;
      ctx.beginPath();
      ctx.moveTo(ZUHAL.x + Math.cos(a) * 6, ZUHAL.y + Math.sin(a) * 6);
      ctx.lineTo(ZUHAL.x + Math.cos(a + 0.5) * (ZUHAL.r - 4), ZUHAL.y + Math.sin(a + 0.5) * (ZUHAL.r - 4));
      ctx.stroke();
    }
    // mata
    const kelip = (Math.sin(performance.now() / 200) > -0.5) ? 1 : 0.25;
    ctx.fillStyle = 'rgba(255,60,60,' + kelip + ')';
    ctx.beginPath(); ctx.arc(ZUHAL.x - 9, ZUHAL.y - 4, 4.5, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(ZUHAL.x + 9, ZUHAL.y - 4, 4.5, 0, 6.283); ctx.fill();
    ctx.restore();
    // HP
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ff4d4d'; fon(11, true);
    ctx.fillText('♥'.repeat(Math.max(0, bos.hp)), ZUHAL.x, ZUHAL.y - ZUHAL.r - 10);
  } else {
    lukisPlanet(ZUHAL, '#ffd24d', '#a07010');
    ctx.save();
    ctx.translate(ZUHAL.x, ZUHAL.y); ctx.rotate(-18 * Math.PI / 180);
    ctx.strokeStyle = 'rgba(255,230,160,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, ZUHAL.r + 12, 6, 0, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,230,160,0.35)'; ctx.lineWidth = 1.5;

    ctx.restore();

  // kilat kena

      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + p * 22, 0, 6.283); ctx.stroke();
    }
  });
}

function lukisLorongAtas() {
  for (let i = 0; i < 3; i++) {
    const l = LORONG[i];
    const cx = (l.x1 + l.x2) / 2;
    const sy = busurY(cx);
    ctx.save();
    // kawasan lorong (jalur di bawah siling)
    ctx.fillStyle = l.nyala ? 'rgba(255,210,77,0.13)' : 'rgba(106,106,138,0.08)';
    ctx.beginPath();
    ctx.moveTo(l.x1, busurY(l.x1));
    for (let x = l.x1; x <= l.x2; x += 4) ctx.lineTo(x, busurY(x));
    ctx.lineTo(l.x2, busurY(l.x2) + LORONG_TEBAL);
    for (let x = l.x2; x >= l.x1; x -= 4) ctx.lineTo(x, busurY(x) + LORONG_TEBAL);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = l.nyala ? 'rgba(255,210,77,0.65)' : 'rgba(106,106,138,0.40)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(l.x1, busurY(l.x1) + 4); ctx.lineTo(l.x1, busurY(l.x1) + LORONG_TEBAL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(l.x2, busurY(l.x2) + 4); ctx.lineTo(l.x2, busurY(l.x2) + LORONG_TEBAL); ctx.stroke();
    const by = sy + LORONG_TEBAL - 12;
    if (l.nyala) {
      const g = ctx.createRadialGradient(cx, by, 2, cx, by, 18);
      g.addColorStop(0, 'rgba(255,210,77,0.5)'); g.addColorStop(1, 'rgba(255,210,77,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, by, 18, 0, 6.283); ctx.fill();
    }
    ctx.fillStyle = l.nyala ? '#ffd24d' : '#3a3a55';
    lukisBintangKecil(cx, by, 8);
    ctx.restore();
  }
  // tiang
  bulatan.forEach(function (b) {
    if (b.jenis !== 'tiang') return;
    const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
    g.addColorStop(0, '#e8e8ff'); g.addColorStop(1, '#5a5a80');
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.283); ctx.fillStyle = g; ctx.fill();
  });
}

function lukisCacing() {
  ctx.save();
  ctx.translate(CACING.x, CACING.y);
  const warna = ['#a44dff', '#ff44cc', '#00e5ff'];
  for (let k = 0; k < 3; k++) {
    ctx.save();
    ctx.rotate(CACING.putar * (k % 2 === 0 ? 1 : -1) * (0.8 + k * 0.3));
    ctx.strokeStyle = warna[k]; ctx.lineWidth = 2.4; ctx.globalAlpha = 0.75;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      const a = t * Math.PI * 2.2;
      const r = 10 + t * (CACING.rv - 10);
      const px = Math.cos(a + k * 2.09) * r, py = Math.sin(a + k * 2.09) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(0, 0, 10, 0, 6.283);
  ctx.fillStyle = '#000'; ctx.fill();
  ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.stroke();
  // zarah berpusar
  for (let i = 0; i < 12; i++) {
    const a = CACING.putar * 2 + i * 0.523;
    const r = 12 + ((i * 2.3 + CACING.putar * 14) % 18);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(Math.cos(a) * r, Math.sin(a) * r, 1.6, 1.6);
  }
  ctx.restore();
  if (misiAktif < 0) {
    const p = 0.5 + 0.5 * Math.sin(performance.now() / 220);
    ctx.strokeStyle = 'rgba(255,210,77,' + (0.35 + 0.5 * p).toFixed(2) + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(CACING.x, CACING.y, CACING.rv + 6, 0, 6.283); ctx.stroke();
    const ay = CACING.y - CACING.rv - 16 + Math.sin(performance.now() / 200) * 5;
    ctx.fillStyle = '#ffd24d';
    ctx.beginPath();
    ctx.moveTo(CACING.x - 8, ay - 7); ctx.lineTo(CACING.x + 8, ay - 7); ctx.lineTo(CACING.x, ay + 5);
    ctx.closePath(); ctx.fill();
  }
}

function lukisRamp() {
  [RAMP_KIRI, RAMP_KANAN].forEach(function (s) {
    const L = LALUAN_RAMP[s.sisi];
    // laluan hantu
    ctx.save();
    ctx.strokeStyle = 'rgba(56,239,125,0.16)'; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(L.p[0][0], L.p[0][1]);
    ctx.bezierCurveTo(L.p[1][0], L.p[1][1], L.p[2][0], L.p[2][1], L.p[3][0], L.p[3][1]);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(56,239,125,0.45)'; ctx.lineWidth = 2;
    ctx.stroke();
    // mulut
    ctx.strokeStyle = '#38ef7d'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
    // kincir bintang (hiasan)
    const mx = (s.x1 + s.x2) / 2, my = (s.y1 + s.y2) / 2;
    ctx.save(); ctx.translate(mx, my);
    ctx.rotate(s.kincir > 0 ? performance.now() / 60 : performance.now() / 900);

function bez(p, t) {
  const u = 1 - t;
  const x = u * u * u * p[0][0] + 3 * u * u * t * p[1][0] + 3 * u * t * t * p[2][0] + t * t * t * p[3][0];
  const y = u * u * u * p[0][1] + 3 * u * u * t * p[1][1] + 3 * u * t * t * p[2][1] + t * t * t * p[3][1];
  return { x: x, y: y };
}

function lukisBola() {
  if (bola.mode === 'ramp') {
    const L = LALUAN_RAMP[bola.rampSisi];
    if (bola.rampT <= 0.55) {
      const t = bola.rampT / 0.55;
      const q = bez(L.p, t);
      const sc = 1 - 0.45 * t;
      ctx.save();
      ctx.globalAlpha = 1 - 0.65 * t;
      for (let i = 1; i <= 6; i++) {
        const q2 = bez(L.p, Math.max(0, t - i * 0.035));
        ctx.globalAlpha = (1 - 0.65 * t) * (1 - i / 7) * 0.7;
        ctx.fillStyle = i % 2 ? '#ffd24d' : '#ff8c00';
        ctx.beginPath(); ctx.arc(q2.x, q2.y, BOLA_R * sc * (1 - i / 9), 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1 - 0.65 * t;
      bolaBulat(q.x, q.y, BOLA_R * sc);
      ctx.restore();
    } else {
      const t = (bola.rampT - 0.55) / 0.35;
      const q = bez(L.p, 1 - t * 0.85);
      ctx.save();
      ctx.globalAlpha = 0.8 * (1 - t);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, 6.283); ctx.fill();
      ctx.restore();
    }
    return;
  }
  if (bola.mode === 'lubang') {
    const t = klip(bola.lubangT / 1.0, 0, 1);
    const pusat = (bola.lubang === 'cacing') ? CACING : BULAN;
    const a = t * 10;
    const r = (1 - t) * (bola.lubang === 'cacing' ? 14 : 10);
    const x = pusat.x + Math.cos(a) * r, y = pusat.y + Math.sin(a) * r;
    bolaBulat(x, y, BOLA_R * (1 - t * 0.7));
    if (bola.lubang === 'bulan') {
      ctx.fillStyle = 'rgba(200,215,235,0.9)'; fon(9, true);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('MENDARAT…', BULAN.x, BULAN.y - BULAN.rv - 10);
    }
    return;
  }
  // jejak
  bola.jejak.push({ x: bola.x, y: bola.y });
  if (bola.jejak.length > 7) bola.jejak.shift();
  for (let i = 0; i < bola.jejak.length - 1; i++) {
    const j = bola.jejak[i];
    ctx.globalAlpha = (i / bola.jejak.length) * 0.28;
    ctx.fillStyle = '#00e5ff';
    ctx.beginPath(); ctx.arc(j.x, j.y, BOLA_R * (0.4 + i / bola.jejak.length * 0.5), 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  bolaBulat(bola.x, bola.y, BOLA_R);
}
function bolaBulat(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#c8d4e8'); g.addColorStop(1, '#556080');
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1; ctx.stroke();
}

function lukisZarah() {
  zarah.forEach(function (p) {
    const a = 1 - p.t / p.hidup;
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = p.warna;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  teksApung.forEach(function (t) {
    ctx.globalAlpha = Math.max(0, 1 - t.t / 0.9);
    ctx.fillStyle = t.warna; fon(13, true);
    ctx.fillText(t.teks, t.x, t.y);
  });
  ctx.globalAlpha = 1;
}

function lukisPadang() {
  ctx.save();
  if (gegar > 0) ctx.translate(rnd(-gegar, gegar), rnd(-gegar, gegar));
  lukisHiasanPadang();
  const redup = (misiAktif >= 0);

  lukisDinding();

  lukisFlipper(FLIP.L);
  lukisFlipper(FLIP.R);
  lukisZarah();
  if (keadaan === 'main') lukisBola();
  ctx.restore();
}

const DT = 1 / 120;
let akum = 0, lalu = performance.now();

function gelung(kini) {
  requestAnimationFrame(gelung);
  let dt = (kini - lalu) / 1000;
  lalu = kini;
  if (!isFinite(dt) || dt < 0) dt = 0;
  if (dt > 0.25) dt = 0.25;

  kemasKini(dt);

  if (keadaan === 'main' && !upacara.aktif) {
    akum += dt;
    let n = 0;
    while (akum >= DT && n < 5 && keadaan === 'main') { langkahFizik(DT); akum -= DT; n++; }
    if (akum > DT * 5) akum = 0;
  } else {
    akum = 0;
    if (keadaan === 'main' && upacara.aktif) kemasFlipper(DT);
  }

  if (keadaan === 'tamat') {
    tamatT += dt;
    const bz = skor - tamatSkorPapar;
    if (Math.abs(bz) < 1) tamatSkorPapar = skor;
    else tamatSkorPapar += bz * Math.min(1, dt * 3.5);
  }

  lukis();
}
requestAnimationFrame(gelung);
kemasButang();

})();
</script>
